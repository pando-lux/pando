<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    .counter {
      text-align: center;
    }
    .count {
      font-size: 6rem;
      font-weight: 700;
      margin: 1rem 0;
      min-width: 200px;
    }
    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    button {
      font-size: 1.5rem;
      padding: 0.5rem 1.5rem;
      border: 2px solid #eee;
      background: transparent;
      color: #eee;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div class="counter">
    <h1>Counter</h1>
    <div class="count" id="count">0</div>
    <div class="buttons">
      <button onclick="update(-1)">- Decrement</button>
      <button onclick="update(1)">+ Increment</button>
    </div>
  </div>
  <script>
    let count = 0;
    const el = document.getElementById('count');
    function update(n) {
      count += n;
      el.textContent = count;
    }
  </script>
</body>
</html>
