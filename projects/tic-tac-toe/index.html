<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e94560;
      text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
    }

    .status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 2rem;
      color: #a8b2d8;
    }

    .status .player-x { color: #e94560; font-weight: bold; }
    .status .player-o { color: #53d8fb; font-weight: bold; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 120px);
      gap: 8px;
      margin: 0 auto 2rem;
      width: fit-content;
    }

    .cell {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.03);
    }

    .cell.x {
      color: #e94560;
      text-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
    }

    .cell.o {
      color: #53d8fb;
      text-shadow: 0 0 15px rgba(83, 216, 251, 0.6);
    }

    .cell.winner {
      background: rgba(255, 215, 0, 0.15);
      border-color: gold;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
      to   { box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
    }

    .cell.taken {
      cursor: default;
    }

    .btn-restart {
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: #fff;
      border: none;
      padding: 0.75rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }

    .btn-restart:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
    }

    .btn-restart:active {
      transform: translateY(0);
    }

    .score-board {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .score-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      min-width: 90px;
    }

    .score-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
      margin-bottom: 0.25rem;
    }

    .score-value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .score-item.x-score .score-value { color: #e94560; }
    .score-item.o-score .score-value { color: #53d8fb; }
    .score-item.draw-score .score-value { color: #a8b2d8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tic&#8209;Tac&#8209;Toe</h1>

    <div class="status" id="status"></div>

    <div class="score-board">
      <div class="score-item x-score">
        <div class="score-label">X Wins</div>
        <div class="score-value" id="score-x">0</div>
      </div>
      <div class="score-item draw-score">
        <div class="score-label">Draws</div>
        <div class="score-value" id="score-draw">0</div>
      </div>
      <div class="score-item o-score">
        <div class="score-label">O Wins</div>
        <div class="score-value" id="score-o">0</div>
      </div>
    </div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button class="btn-restart" id="btn-restart">New Game</button>
  </div>

  <script>
    const WIN_PATTERNS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // cols
      [0, 4, 8], [2, 4, 6],             // diagonals
    ];

    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0, draw: 0 };

    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const btnRestart = document.getElementById('btn-restart');
    const scoreX = document.getElementById('score-x');
    const scoreO = document.getElementById('score-o');
    const scoreDraw = document.getElementById('score-draw');

    function updateStatus(msg) {
      statusEl.innerHTML = msg;
    }

    function setTurnStatus() {
      const cls = currentPlayer === 'X' ? 'player-x' : 'player-o';
      updateStatus(`Player <span class="${cls}">${currentPlayer}</span>'s turn`);
    }

    function checkWinner() {
      for (const [a, b, c] of WIN_PATTERNS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], line: [a, b, c] };
        }
      }
      if (board.every(cell => cell !== null)) return { winner: null, draw: true };
      return null;
    }

    function handleClick(e) {
      const cell = e.currentTarget;
      const idx = parseInt(cell.dataset.index);

      if (gameOver || board[idx]) return;

      board[idx] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase(), 'taken');

      const result = checkWinner();

      if (result) {
        gameOver = true;
        if (result.winner) {
          result.line.forEach(i => cells[i].classList.add('winner'));
          const cls = result.winner === 'X' ? 'player-x' : 'player-o';
          updateStatus(`Player <span class="${cls}">${result.winner}</span> wins! 🎉`);
          scores[result.winner]++;
        } else {
          updateStatus("It's a draw!");
          scores.draw++;
        }
        scoreX.textContent = scores.X;
        scoreO.textContent = scores.O;
        scoreDraw.textContent = scores.draw;
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        setTurnStatus();
      }
    }

    function resetGame() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
      setTurnStatus();
    }

    cells.forEach(cell => cell.addEventListener('click', handleClick));
    btnRestart.addEventListener('click', resetGame);

    // Init
    setTurnStatus();
  </script>
</body>
</html>
