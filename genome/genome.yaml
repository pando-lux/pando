# Pando Project Genome
# The single source of truth for the Pando decentralized network.
# Read genome.yaml for the map. Drill into component/flow/rule files for details.
# AI-maintained: genome agent watches git diffs and updates affected files.

name: Pando Network
type: distributed-system
description: >
  Decentralized, AI-managed P2P network. The open internet for everyone.
  P2P protects the brain (identity, economy, coordination, governance, survival).
  Hosting and deployment use existing internet infrastructure (GitHub, Vercel, AWS).
  Pando co-exists with the internet — it cannot be killed because the node network is decentralized,
  but it uses the internet's body for serving content and storing outputs.
repo: https://github.com/pando-lux/pando
founder: Pando
currency: Lux
license: open-source

# ── Components ──────────────────────────────────────────────────────────────

components:

  # ── Core (brain + muscle) ─────────────────────────────────────────────
  - id: bridge-queue
    file: components/bridge-queue.md
    type: service
    domain: core
    summary: Central event-driven communication hub — all agents talk through the bridge, Manager pulls one item at a time

  - id: agent
    file: components/agent.md
    type: service
    domain: core
    summary: Universal Agent Primitive — every agent (manager, builder, tester, reviewer) is an Agent with workspace, Claude Code session, 4-layer template, state persistence, hard limits

  - id: agent-manager
    file: components/agent-manager.md
    type: service
    domain: core
    summary: Agent lifecycle manager — bridge watcher, spawn/resume/rotate agents, registry, cleanup sweep, project access control

  - id: agent-tools
    file: components/agent-tools.md
    type: service
    domain: core
    summary: HTTP API handlers for agent operations — spawn, message, report, tree view, project management

  - id: manager
    file: components/manager.md
    type: service
    domain: core
    summary: Agent with 'manager' role — coordinates team, talks to users, processes bridge items, delegates to children

  - id: scheduler
    file: components/scheduler.md
    type: service
    domain: core
    summary: Pure executor — spawns workers, collects results, enqueues to bridge. Zero decisions.

  - id: task-queue
    file: components/task-queue.md
    type: data-store
    domain: core
    summary: SQLite task storage with parent/child hierarchy

  - id: genome-agent
    file: components/genome-agent.md
    type: utility
    domain: support
    summary: Optional utility — YAML parser, file matcher, drift checker. Workers and Manager read genome files directly.

  # ── Pipeline (DEPRECATED — Manager workflow replaces standalone pipeline) ──
  - id: pipeline-runner
    file: components/pipeline-runner.md
    type: service
    domain: pipeline
    status: DEPRECATED
