  - id: resource-network
    file: flows/resource-network.md
    summary: "Heterogeneous node architecture — capability detection, resource routing, marketplace pricing, how different node types coexist and earn Lux"

  - id: p2p-upgrade
    file: flows/p2p-upgrade.md
    summary: "Phase 82: P2P self-upgrade — any node proposes, governance approves, broadcasts commit hash via GossipSub, all nodes git pull + verify hash + build + restart"

  - id: app-hosting
    file: flows/app-hosting.md
    description: "3-tier app hosting: S3 static, EC2 compute, node-hosted"

# ── Rules ───────────────────────────────────────────────────────────────

rules:
  - id: two-laws
    file: rules/two-laws.md
    severity: immutable
    summary: "Law I: Do not harm humans. Law II: Survive. Law I always wins."

  - id: authority-model
    file: rules/authority-model.md
    severity: critical
    summary: Only Managers create tasks. Workers execute. Scheduler allocates. No exceptions.

  - id: worker-isolation
    file: rules/worker-isolation.md
    severity: critical
    summary: Workers cannot create tasks, access other workspaces, or call node API.

  - id: data-only-subsystems
    file: rules/data-only-subsystems.md
    severity: critical
    summary: HealthMonitor collects data ONLY. No autonomous actions.

  - id: pure-executor
    file: rules/pure-executor.md
    severity: critical
    summary: Scheduler makes ZERO decisions. No Planner, no auto-approve, no auto-commit.

  - id: workflow-pipeline
    file: rules/workflow-pipeline.md
    severity: high
    summary: "Manager follows: PLAN → SPAWN → REVIEW → QA → COMMIT → DOCS → REPORT"

  - id: qa-standard
    file: rules/qa-standard.md
    severity: high
    summary: Browser-level testing required. Code review alone is NOT sufficient.

  - id: immutable-kernel
    file: rules/immutable-kernel.md
    severity: critical
    summary: Certain core files cannot be modified by agents — guardrails.ts enforces.

  - id: budget-enforcement
    file: rules/budget-enforcement.md
    severity: high
    summary: Lux limits per project per day. 500 Lux max per node per day.

  - id: p2p-first
    file: rules/p2p-first.md
    severity: medium
    summary: Every feature should work across nodes. Local-only = prototype.

  - id: lux-economics
    file: rules/lux-economics.md
    severity: high
    summary: "Lux = work receipt. 10B hard cap, witness verification, anti-Sybil, no burning/halving/staking."

  - id: project-types
    file: rules/project-types.md
    severity: high
    summary: "Three project types: Personal (user pays), Public (governance-approved), Admin (own resources)."

  - id: todo-loop
    file: rules/todo-loop.md
    severity: high
    summary: "All agents maintain self-verifying todo loops. Work→Verify→Fix→Loop. Docs updated with code. Loop until done."

  - id: governance-tiers
    file: rules/governance-tiers.md
    severity: high
    summary: "Two-tier governance: network-level (all nodes vote on node changes) vs project-level (only stakeholders vote on project changes). Manager classifies which tier applies."

  - id: credential-security
    file: rules/credential-security.md
    severity: critical
    summary: "Phase 69: Two-tier trust — credentials encrypted in MongoDB (AES-256-GCM + master key), only EC2 compute nodes decrypt. User nodes route via P2P, never see credentials."

  - id: data-residency
    file: rules/data-residency.md
    severity: critical
    summary: "Three Buckets: User Data → MongoDB (survives node death), Network State → SQLite+P2P (rebuilds from peers), Operational → local (disposable). Phase 44."

  # ── v2.1 new: AI Backend system ────────────────────────────────────────
  - id: ai-backend
    file: components/ai-backend.md
    type: interface
    layer: core
    domain: core
    source: packages/node/src/core/ai-backend.ts
    summary: "AIBackend interface — execute(task) → result. Implementations: claude-code (primary), ollama (stub). Agent system uses registry, never spawns directly."

  - id: ai-backend-registry
