<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 48px 64px;
      text-align: center;
    }
    h1 {
      color: #888;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .count {
      color: #fff;
      font-size: 80px;
      font-weight: 700;
      line-height: 1;
      min-width: 160px;
      margin-bottom: 32px;
    }
    .count.negative { color: #f87171; }
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    button {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: none;
      font-size: 24px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    button:active { transform: scale(0.94); }
    .dec { background: #2a1a1a; color: #f87171; }
    .dec:hover { background: #3a1a1a; }
    .inc { background: #1a2a1a; color: #4ade80; }
    .inc:hover { background: #1a3a1a; }
    .reset {
      margin-top: 24px;
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #555;
      font-size: 13px;
      width: auto;
      height: auto;
      padding: 8px 20px;
      border-radius: 8px;
    }
    .reset:hover { color: #888; border-color: #444; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Counter</h1>
    <div class="count" id="count">0</div>
    <div class="buttons">
      <button class="dec" onclick="change(-1)">−</button>
      <button class="inc" onclick="change(1)">+</button>
    </div>
    <br>
    <button class="reset" onclick="reset()">Reset</button>
  </div>

  <script>
    let count = 0;
    const el = document.getElementById('count');

    function change(delta) {
      count += delta;
      el.textContent = count;
      el.className = 'count' + (count < 0 ? ' negative' : '');
    }

    function reset() {
      count = 0;
      el.textContent = 0;
      el.className = 'count';
    }
  </script>
</body>
</html>
