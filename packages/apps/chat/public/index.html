<!DOCTYPE html><html><head><title>Pando Chat</title><style>body{font-family:sans-serif;max-width:600px;margin:40px auto}#log{border:1px solid #ccc;height:300px;overflow-y:auto;padding:8px;margin-bottom:8px}#row{display:flex;gap:8px}#msg{flex:1;padding:8px}button{padding:8px 16px}</style></head><body><h1>Pando Chat</h1><div id="log"></div><div id="row"><input id="msg" type="text" placeholder="Type a message..."><button onclick="send()">Send</button></div><script>const ws=new WebSocket('ws://'+location.host+'/ws');ws.onmessage=e=>{const d=document.getElementById('log');d.innerHTML+='<p>'+e.data+'</p>';d.scrollTop=d.scrollHeight};function send(){const i=document.getElementById('msg');if(i.value){ws.send(i.value);i.value=''}}document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()})</script></body></html>
